# See https://docs.sqlc.dev/en/latest/reference/config.html for documentation on the fields
version: "2"
sql:
  - name: "athletes"
    queries: "./internal/athletes/queries"
    schema: "./internal/store/migrations"
    engine: "postgresql"
    gen:
      go:
        package: "internal"
        out: "./internal/athletes/internal"
        sql_package: "pgx/v5"
        sql_driver: "github.com/jackc/pgx/v5"
        emit_interface: false
        emit_params_struct_pointers: true
        emit_result_struct_pointers: true
        emit_enum_valid_method: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
  - name: "users"
    queries: "./internal/users/queries"
    schema: "./internal/store/migrations"
    engine: "postgresql"
    gen:
      go:
        package: "internal"
        out: "./internal/users/internal"
        sql_package: "pgx/v5"
        sql_driver: "github.com/jackc/pgx/v5"
        emit_interface: false
        emit_params_struct_pointers: true
        emit_result_struct_pointers: true
        emit_enum_valid_method: true
        initialisms:
          - id
          - json
          - usb
          - nfc
          - ble
          - api
          - sha256
  - name: "activities"
    queries: "./internal/activities/queries"
    schema: "./internal/store/migrations"
    engine: "postgresql"
    gen:
