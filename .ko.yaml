# Configuration for building the container image with ko (https://ko.build).
defaultBaseImage: gcr.io/distroless/static-debian12:nonroot
defaultPlatforms:
  - linux/amd64
builds:
  - id: trailrunn.ing
    main: ./cmd/trailrunn.ing
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
  - id: osmimport
    main: ./cmd/osmimport
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
