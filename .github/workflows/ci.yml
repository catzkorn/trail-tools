name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  format:
    name: Check diff after formatting code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Lint and code generation tools must support the Go version, so
          # use the one in go.mod rather than the latest.
          go-version-file: go.mod
      - name: Run make format
        run: |
          make format
          git diff --exit-code --name-only

  lint:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Lint and code generation tools must support the Go version, so
          # use the one in go.mod rather than the latest.
          go-version-file: go.mod
      - name: Run make lint
        run: |
          make web-deps
          make lint

  gen:
    name: Check diff after regenerating code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Lint and code generation tools must support the Go version, so
          # use the one in go.mod rather than the latest.
          go-version-file: go.mod
      - name: Run make gen
        run: |
          make web-deps
          make gen
          git diff --exit-code --name-only

  build:
    name: Build Go code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["stable", "oldstable"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run go build
        run: go build ./...

  test:
    name: Run Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS and pgRouting, matching the versions on Neon.
        image: pgrouting/pgrouting:18-3.6-3.8
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Lint and code generation tools must support the Go version, so
          # use the one in go.mod rather than the latest.
          go-version-file: go.mod
      - name: Run go test
        run: go test -race ./...

  mod:
    name: Check diff after tidying go.mod and go.sum
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Lint and code generation tools must support the Go version, so
          # use the one in go.mod rather than the latest.
          go-version-file: go.mod
      - run: |
          make web-deps
          go mod tidy
          git diff --exit-code --name-only
