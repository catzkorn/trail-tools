name: CI

on:
  push:
    branches:
      - main
  pull_request:

# A new push to a pull request cancels its now stale run. Runs on main all
# complete, so each commit is deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with the version used locally, as Terraform refuses to read
  # state written by a newer version.
  TERRAFORM_VERSION: "1.14.8"

jobs:
  format:
    name: Check diff after formatting code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        # Lint and code generation tools must support the Go version, so
        # use the one in go.mod rather than the latest.
        uses: ./.github/actions/setup-go
        with:
          cache-name: format
      - name: Run make format
        run: |
          make format
          git diff --exit-code --name-only
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: format

  lint:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        # Lint and code generation tools must support the Go version, so
        # use the one in go.mod rather than the latest.
        uses: ./.github/actions/setup-go
        with:
          cache-name: lint
      - name: Run make lint
        run: |
          make web-deps
          make lint
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: lint

  gen:
    name: Check diff after regenerating code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        # Lint and code generation tools must support the Go version, so
        # use the one in go.mod rather than the latest.
        uses: ./.github/actions/setup-go
        with:
          cache-name: gen
      - name: Run make gen
        run: |
          make web-deps
          make gen
          git diff --exit-code --name-only
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: gen

  build:
    name: Build Go code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["stable", "oldstable"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go-version }}
          cache-name: build-${{ matrix.go-version }}
      - name: Run go build
        run: go build ./...
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: build-${{ matrix.go-version }}

  test:
    name: Run Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # PostGIS and pgRouting, matching the versions on Neon.
        image: pgrouting/pgrouting:18-3.6-3.8
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        # Lint and code generation tools must support the Go version, so
        # use the one in go.mod rather than the latest.
        uses: ./.github/actions/setup-go
        with:
          cache-name: test
      - name: Run go test
        run: go test -race ./...
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: test

  mod:
    name: Check diff after tidying go.mod and go.sum
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        # Lint and code generation tools must support the Go version, so
        # use the one in go.mod rather than the latest.
        uses: ./.github/actions/setup-go
        with:
          cache-name: mod
      - run: |
          make web-deps
          go mod tidy
          git diff --exit-code --name-only
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: mod
          modules: true

  terraform:
    name: Check Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Check formatting and validate
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [format, lint, gen, build, test, mod, terraform]
    runs-on: ubuntu-latest
    # Only one deployment at a time. Terraform also locks its state.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      # Needed to authenticate to Google Cloud with Workload Identity
      # Federation, without stored credentials.
      id-token: write
    env:
      KO_DOCKER_REPO: us-west1-docker.pkg.dev/trail-tools-444904/trail-tools/server
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-name: deploy
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/296221712346/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-terraform@trail-tools-444904.iam.gserviceaccount.com
      - name: Build and push the image
        run: echo "IMAGE=$(go tool ko build --bare --tags "${GITHUB_SHA},latest" .)" >> "$GITHUB_ENV"
      - name: Apply Terraform
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra apply -input=false -auto-approve -var "image=${IMAGE}"
      - name: Save Go caches
        if: ${{ !cancelled() }}
        uses: ./.github/actions/save-go-cache
        with:
          cache-name: deploy
