syntax = "proto3";

package lactate.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "mcp/v1/options.proto";

// LactateTestService manages the user's blood lactate tests, which find the
// heart rate of their aerobic threshold (LT1, also called AeT): the top of
// their easy, zone 2 running.
//
// In a test, the user runs stages at increasing heart rates, e.g. 100, 110,
// 120 bpm, holding each for a few minutes, and measures their blood lactate
// with a finger or earlobe prick at the end of each. The aerobic threshold is
// the heart rate at which lactate reaches 2 mmol/L, interpolated between the
// stages. Two other common definitions are computed for comparison: 2.5
// mmol/L, and 1 mmol/L above the lowest reading.
//
// The aerobic threshold of the user's latest test that found one is their
// aerobic heart rate cap: base workouts in training plans, see
// TrainingPlanService, should stay below it. Tests are worth repeating every
// two to three months, as the threshold moves with training.
service LactateTestService {
  // Record a lactate test.
  rpc CreateLactateTest(CreateLactateTestRequest) returns (CreateLactateTestResponse);
  // Get a lactate test by ID.
  rpc GetLactateTest(GetLactateTestRequest) returns (GetLactateTestResponse);
  // List the user's lactate tests, the latest first. The first with an
  // aerobic_threshold_heart_rate_bpm is the user's current aerobic threshold.
  rpc ListLactateTests(ListLactateTestsRequest) returns (ListLactateTestsResponse);
  // Update a lactate test, e.g. to add a stage's reading during a test.
  rpc UpdateLactateTest(UpdateLactateTestRequest) returns (UpdateLactateTestResponse);
  // Delete a lactate test.
  rpc DeleteLactateTest(DeleteLactateTestRequest) returns (DeleteLactateTestResponse);
}

// A blood lactate test.
message LactateTest {
  // The ID of the test. Ignored when creating a test.
  string id = 1;
  // The date of the test (YYYY-MM-DD).
  string date = 2;
  // Free text notes, e.g. the conditions, the route or treadmill incline,
  // and what the user ate beforehand.
  string notes = 3;
  // The resting blood lactate, measured before warming up, in mmol/L. 0 if
  // not measured. Above about 2 mmol/L at rest suggests a recent meal or hard
  // training.
  double resting_lactate_mmol_per_liter = 4;
  // The stages, in the order they were run, each at a higher heart rate than
  // the last. At most 30.
  repeated LactateStage stages = 5;
  // The lowest lactate reading, at rest or of a stage, in mmol/L. 0 if there
  // are none. The user's baseline lactate.
  double lowest_lactate_mmol_per_liter = 6 [(mcp.v1.field).output_only = true];
  // The heart rate at the aerobic threshold, where lactate first rises to 2
  // mmol/L, interpolated between the stages. 0 if no stage reached it, or the
  // first stage was already above it.
  int32 aerobic_threshold_heart_rate_bpm = 7 [(mcp.v1.field).output_only = true];
  // The heart rate at the aerobic threshold by each definition, for
  // comparison, starting with 2 mmol/L.
  repeated ThresholdEstimate threshold_estimates = 8 [(mcp.v1.field).output_only = true];
  // When the test was created.
  google.protobuf.Timestamp create_time = 9 [(mcp.v1.field).output_only = true];
  // When the test was last updated.
  google.protobuf.Timestamp update_time = 10 [(mcp.v1.field).output_only = true];
}

// ThresholdDefinition is a definition of the aerobic threshold by blood
// lactate.
enum ThresholdDefinition {
  THRESHOLD_DEFINITION_UNSPECIFIED = 0;
  // Lactate reaches 2 mmol/L, the definition the aerobic threshold uses.
  THRESHOLD_DEFINITION_FIXED_2_MMOL = 1;
  // Lactate reaches 2.5 mmol/L.
  THRESHOLD_DEFINITION_FIXED_2_5_MMOL = 2;
  // Lactate rises 1 mmol/L above the lowest reading.
  THRESHOLD_DEFINITION_LOWEST_PLUS_1_MMOL = 3;
}

// The aerobic threshold of a test by one definition.
message ThresholdEstimate {
  // The definition.
  ThresholdDefinition definition = 1;
  // The lactate the definition looks for, in mmol/L, e.g. 2.
  double lactate_mmol_per_liter = 2;
  // The heart rate where lactate first rises to it, interpolated between the
  // stages. 0 if no stage reached it, or the first stage was already above
  // it.
  int32 heart_rate_bpm = 3;
}

// A stage of a lactate test: running at a steady heart rate for a few
// minutes, then measuring the blood lactate.
message LactateStage {
  // The heart rate held during the stage, e.g. 120. From 40 to 230.
  int32 heart_rate_bpm = 1;
  // The blood lactate measured at the end of the stage, in mmol/L, e.g. 1.4.
  // From 0.1 to 30.
  double lactate_mmol_per_liter = 2;
}

message CreateLactateTestRequest {
  // The test to create.
  LactateTest test = 1;
}

message CreateLactateTestResponse {
  // The created test.
  LactateTest test = 1;
}

message GetLactateTestRequest {
  // The ID of the test.
  string id = 1;
}

message GetLactateTestResponse {
  // The test.
  LactateTest test = 1;
}

message ListLactateTestsRequest {}

message ListLactateTestsResponse {
  // The user's tests, the latest first.
  repeated LactateTest tests = 1;
}

message UpdateLactateTestRequest {
  // The test to update. The ID must be set.
  LactateTest test = 1;
  // The fields to update, e.g. "stages,notes". If empty, all fields are
  // replaced.
  google.protobuf.FieldMask update_mask = 2;
}

message UpdateLactateTestResponse {
  // The updated test.
  LactateTest test = 1;
}

message DeleteLactateTestRequest {
  // The ID of the test to delete.
  string id = 1;
}

message DeleteLactateTestResponse {}
